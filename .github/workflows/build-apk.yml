name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK: $SDK"
          SDKM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5

      - name: NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release
          find app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Build APKs
        run: |
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            --no-daemon assembleUniversalRelease assembleArm64Release assembleArm32Release

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Sign APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | head -1)
          echo "apksigner: $APKSIGNER"
          mkdir -p sign
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > sign/tgws.jks
            echo "ключ подписи: из секрета репозитория"
          else
            keytool -genkeypair -keystore sign/tgws.jks -alias tgws -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass tgws-release -keypass tgws-release \
              -dname "CN=tgws-proxy, O=Sititek, C=RU" > /dev/null
            base64 -w0 sign/tgws.jks > sign/tgws-keystore.b64
            echo "ключ подписи: сгенерирован впервые (сохрани секрет из артефакта)"
          fi
          for f in out/*-unsigned.apk; do
            o="out/$(basename "${f%-unsigned.apk}")-signed.apk"
            "$APKSIGNER" sign --ks sign/tgws.jks --ks-pass pass:tgws-release \
              --key-pass pass:tgws-release --ks-key-alias tgws --out "$o" "$f"
            "$APKSIGNER" verify --print-certs "$o" | head -2
          done
          ls -lh out/ out/sign 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: tgws-apk
          path: |
            out/*-signed.apk
            sign/tgws-keystore.b64